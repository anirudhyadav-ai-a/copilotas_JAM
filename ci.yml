# CI workflow for copilotas_JAM — copy to .github/workflows/copilotas_JAM-ci.yml to activate
# Run: triggered on push/PR touching copilotas_JAM/**
name: CI — copilotas_JAM

on:
  push:
    paths: ["copilotas_JAM/**"]
  pull_request:
    paths: ["copilotas_JAM/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[all]"
      - run: pytest copilotas_JAM/ -v --tb=short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff black
      - run: ruff check copilotas_JAM/
      - run: black --check copilotas_JAM/
