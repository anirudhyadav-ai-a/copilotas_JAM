# copilotas_JAM — local dev stack
# Deps: app + Redis (verdict history + session memory) + pgvector (code embeddings for codebase context)
# Run: docker-compose up
# Access: Webhook server http://localhost:8080
version: "3.9"
services:
  app:
    build: .
    ports: ["8080:8080"]
    volumes: [".:/app"]
    env_file: ["../.env"]
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://app:app@postgres:5432/judgedb
      - VECTOR_STORE=pgvector
      - CODE_DOM_DB_PATH=/app/code_dom.sqlite
    depends_on: [postgres, redis]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: judgedb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../deployment/docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  postgres_data:
